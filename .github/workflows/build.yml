name: Build XRD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build XRD Tweak + IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid dpkg

          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS

          curl -L -o /tmp/iPhoneOS14.5.sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz"
          mkdir -p $THEOS/sdks
          tar -xf /tmp/iPhoneOS14.5.sdk.tar.xz -C $THEOS/sdks

          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make FINALPACKAGE=1
        env:
          THEOS: ${{ env.THEOS }}

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: XRD-dylib
          path: .theos/obj/XRD.dylib
          if-no-files-found: warn

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: XRD-deb
          path: packages/*.deb
          if-no-files-found: warn

      # ── IPA Build ───────────────────────────────────────────────────────
      # Downloads the base Agar.io IPA from the latest GitHub Release,
      # injects XRD.dylib, signs, and uploads the modded IPA.
      #
      # To set up: create a GitHub Release and upload your decrypted
      # Agar.io IPA as "agar.io.ipa" (or any .ipa filename).

      - name: Download base IPA from release
        id: get_ipa
        run: |
          # Try to download the IPA from the latest release
          IPA_URL=$(gh release view --json assets -q '.assets[] | select(.name | endswith(".ipa")) | .url' 2>/dev/null || true)

          if [ -n "$IPA_URL" ]; then
            echo "Downloading base IPA from release..."
            gh release download --pattern "*.ipa" -D /tmp/base-ipa/
            BASE_IPA=$(ls /tmp/base-ipa/*.ipa | head -1)
            echo "ipa_path=$BASE_IPA" >> $GITHUB_OUTPUT
            echo "has_ipa=true" >> $GITHUB_OUTPUT
          else
            echo "No IPA found in releases. Upload a decrypted Agar.io IPA to a GitHub Release."
            echo "has_ipa=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup injection tools
        if: steps.get_ipa.outputs.has_ipa == 'true'
        run: |
          git clone https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib_src
          cd /tmp/insert_dylib_src
          gcc insert_dylib/main.c -o /tmp/insert_dylib_bin -framework Security -O2
          sudo cp /tmp/insert_dylib_bin /usr/local/bin/insert_dylib
          insert_dylib --help 2>&1 || true
          echo "insert_dylib installed successfully"

      - name: Download real CydiaSubstrate binary
        id: get_substrate
        if: steps.get_ipa.outputs.has_ipa == 'true'
        run: |
          # Theos only ships a .tbd stub — we need the actual Mach-O for sideloaded IPAs.
          # The framework binary is in the mobilesubstrate deb, NOT substrate.safemode.
          # Try multiple mirrors since apt repos go down.

          FOUND=false

          # Source 1: Bingner repo (checkra1n/unc0ver mirror)
          for url in \
            "https://apt.bingner.com/debs/1443.00/mobilesubstrate_0.9.7113_iphoneos-arm.deb" \
            "https://apt.bingner.com/debs/1443.00/mobilesubstrate_0.9.7112_iphoneos-arm.deb" \
            "https://apt.bingner.com/debs/1443.00/mobilesubstrate_0.9.7111_iphoneos-arm.deb"; do
            echo "Trying: $url"
            if curl -fsSL -o /tmp/substrate.deb "$url" 2>/dev/null; then
              echo "Downloaded from: $url"
              FOUND=true
              break
            fi
          done

          # Source 2: Elucubratus repo
          if [ "$FOUND" = false ]; then
            for url in \
              "https://apt.elucubratus.com/debs/mobilesubstrate_0.9.7113_iphoneos-arm.deb" \
              "https://repo.theodyssey.dev/debs/mobilesubstrate_0.9.7113_iphoneos-arm.deb"; do
              echo "Trying: $url"
              if curl -fsSL -o /tmp/substrate.deb "$url" 2>/dev/null; then
                echo "Downloaded from: $url"
                FOUND=true
                break
              fi
            done
          fi

          # Source 3: Check if our repo has it as a release asset
          if [ "$FOUND" = false ]; then
            echo "Trying GitHub release asset..."
            gh release download --pattern "CydiaSubstrate" -D /tmp/ 2>/dev/null && FOUND=true || true
          fi

          if [ "$FOUND" = true ] && [ -f /tmp/substrate.deb ]; then
            mkdir -p /tmp/substrate-extract
            cd /tmp/substrate-extract
            ar x /tmp/substrate.deb
            # Handle different compression formats
            for f in data.tar*; do
              case "$f" in
                *.xz)   xz -d "$f" && tar xf data.tar ;;
                *.zst)  zstd -d "$f" && tar xf data.tar ;;
                *.gz)   tar xzf "$f" ;;
                *.bz2)  tar xjf "$f" ;;
                *.lzma) lzma -d "$f" && tar xf data.tar ;;
                *)      tar xf "$f" 2>/dev/null ;;
              esac
            done

            # The binary is at /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate
            SUBSTRATE_BIN=$(find /tmp/substrate-extract -name "CydiaSubstrate" -not -name "*.h" -not -name "*.plist" -type f 2>/dev/null | head -1)
            if [ -z "$SUBSTRATE_BIN" ]; then
              SUBSTRATE_BIN=$(find /tmp/substrate-extract -name "libsubstrate.dylib" -type f 2>/dev/null | head -1)
            fi

            if [ -n "$SUBSTRATE_BIN" ] && file "$SUBSTRATE_BIN" | grep -q "Mach-O"; then
              echo "Found real CydiaSubstrate Mach-O: $SUBSTRATE_BIN"
              echo "substrate_bin=$SUBSTRATE_BIN" >> $GITHUB_OUTPUT
            else
              echo "::warning::Extracted files but no Mach-O CydiaSubstrate binary found"
              find /tmp/substrate-extract -type f | head -20
            fi
          elif [ -f /tmp/CydiaSubstrate ]; then
            # From GitHub release asset
            echo "substrate_bin=/tmp/CydiaSubstrate" >> $GITHUB_OUTPUT
          else
            echo "::warning::Could not download CydiaSubstrate binary from any source"
            echo "::warning::Upload CydiaSubstrate as a GitHub release asset to fix this"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Inject dylib into IPA
        if: steps.get_ipa.outputs.has_ipa == 'true'
        run: |
          chmod +x tools/inject.sh
          export THEOS=$HOME/theos
          export SUBSTRATE_BIN="${{ steps.get_substrate.outputs.substrate_bin || '' }}"
          ./tools/inject.sh \
            "${{ steps.get_ipa.outputs.ipa_path }}" \
            .theos/obj/XRD.dylib \
            "$GITHUB_WORKSPACE/XRD-modded.ipa"

      - name: Upload modded IPA
        if: steps.get_ipa.outputs.has_ipa == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XRD-IPA
          path: ${{ github.workspace }}/XRD-modded.ipa
          if-no-files-found: warn
